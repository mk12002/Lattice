[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lattice-scanner"
version = "0.2.1"
description = "Crypto-agility and post-quantum-readiness scanner: builds a CBOM, grades quantum/classical risk, and emits a migration roadmap."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Lattice contributors" }]
keywords = ["cryptography", "post-quantum", "cbom", "security", "static-analysis", "sbom"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
# Runtime dependency policy: standard library ONLY. Every third-party
# dependency is a supply-chain liability in a security tool. See README.
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "mypy>=1.8",
    "bandit>=1.7",
    "pip-audit>=2.7",
]

[project.scripts]
lattice = "lattice.cli:main"

[project.urls]
Homepage = "https://github.com/lattice-scanner/lattice"

[tool.setuptools.packages.find]
include = ["lattice*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.bandit]
# B105 (hardcoded_password_string) fires on algorithm-name string literals
# like "DES" that this crypto-analysis tool compares constantly. Lattice
# handles no credentials, tokens, or passwords anywhere (no network, no auth),
# so B105 can have no true positive here. Skipped project-wide, by design.
skips = ["B105"]

[tool.mypy]
python_version = "3.11"
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["lattice"]
