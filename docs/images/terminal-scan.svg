  <text xml:space="preserve" x="20" y="160"><tspan fill="#7f849c">scanned 4 files (0 skipped): 15 findings</tspan></text>

  <text xml:space="preserve" x="20" y="192"><tspan fill="#cdd6f4">priorities:  </tspan><tspan fill="#f38ba8" font-weight="bold">P0=5</tspan><tspan fill="#cdd6f4">  </tspan><tspan fill="#fab387" font-weight="bold">P1=1</tspan><tspan fill="#cdd6f4">  </tspan><tspan fill="#f9e2af" font-weight="bold">P2=3</tspan><tspan fill="#cdd6f4">  </tspan><tspan fill="#7d9fc9" font-weight="bold">P3=1</tspan><tspan fill="#cdd6f4">  </tspan><tspan fill="#a6e3a1" font-weight="bold">none=5</tspan></text>

  <!-- readiness bar -->
  <text xml:space="preserve" x="20" y="222"><tspan fill="#cdd6f4">readiness score: </tspan><tspan fill="#f9e2af" font-weight="bold">56/100</tspan></text>
  <rect x="20" y="234" width="560" height="12" rx="6" fill="#313244"/>
  <rect x="20" y="234" width="314" height="12" rx="6" fill="#f9e2af"/>

  <text xml:space="preserve" x="20" y="286"><tspan fill="#f38ba8" font-weight="bold">fail-on gate: 5 finding(s) at or above P0</tspan></text>

  <text xml:space="preserve" x="20" y="318">
    <tspan fill="#a6e3a1">$</tspan><tspan fill="#cdd6f4"> echo $?</tspan>
  </text>
