<svg xmlns="http://www.w3.org/2000/svg" width="880" height="384" viewBox="0 0 880 384" font-family="ui-monospace, 'Cascadia Code', 'Consolas', monospace" font-size="14.5">
  <rect width="880" height="384" rx="10" fill="#1e1e2e"/>
  <!-- title bar -->
  <rect width="880" height="34" rx="10" fill="#181825"/>
  <rect y="20" width="880" height="14" fill="#181825"/>
  <circle cx="22" cy="17" r="6" fill="#f38ba8"/>
  <circle cx="44" cy="17" r="6" fill="#f9e2af"/>
  <circle cx="66" cy="17" r="6" fill="#a6e3a1"/>
  <text x="440" y="22" fill="#7f849c" font-size="12.5" text-anchor="middle">lattice — post-quantum readiness scan</text>

  <text xml:space="preserve" x="20" y="66">
    <tspan fill="#a6e3a1">$</tspan><tspan fill="#cdd6f4"> lattice scan . --format all --fail-on P0</tspan>
  </text>

  <text xml:space="preserve" x="20" y="94"><tspan fill="#cdd6f4">wrote report/cbom.json</tspan></text>
  <text xml:space="preserve" x="20" y="116"><tspan fill="#cdd6f4">wrote report/report.html</tspan></text>
