# Fixture: nginx-style TLS configuration with deliberately weak settings.
#
# Known answers:
# - TLS-1.0 and TLS-1.1 enabled -> P2 each (deprecated protocols)
# - TLS-1.2 enabled             -> compliant (inventoried)
# - RC4 in cipher suite         -> P0 classically broken
# - 3DES in cipher suite        -> P2 deprecated
ssl_protocols TLSv1 TLSv1.1 TLSv1.2;
ssl_ciphers 'RC4:3DES:HIGH:!aNULL:!MD5';
