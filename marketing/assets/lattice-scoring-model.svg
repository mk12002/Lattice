<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#cdd6f4"/>
    </marker>
  </defs>

  <rect width="960" height="620" fill="#1e1e2e"/>
  <text x="480" y="42" fill="#cdd6f4" font-size="24" font-weight="700" text-anchor="middle">Which crypto breaks first?</text>
  <text x="480" y="66" fill="#7f849c" font-size="13" text-anchor="middle">Lattice's migration-priority model — the entire spec is a 30-row truth table in the test suite</text>

  <!-- Finding -->
  <rect x="380" y="92" width="200" height="46" rx="10" fill="#313244" stroke="#89b4fa"/>
  <text x="480" y="115" fill="#89b4fa" font-size="14" font-weight="700" text-anchor="middle">finding: algorithm</text>
  <text x="480" y="131" fill="#a6adc8" font-size="11" text-anchor="middle">at a real file:line</text>

  <!-- Q1 broken today -->
  <rect x="330" y="168" width="300" height="52" rx="10" fill="#181825" stroke="#f38ba8"/>
  <text x="480" y="190" fill="#cdd6f4" font-size="13.5" font-weight="700" text-anchor="middle">Broken today, no quantum needed?</text>
  <text x="480" y="208" fill="#7f849c" font-size="11.5" text-anchor="middle">MD5 · SHA-1 · DES · RC4 · any cipher in ECB mode</text>
  <line x1="480" y1="138" x2="480" y2="164" stroke="#cdd6f4" stroke-width="2" marker-end="url(#arr)"/>

  <!-- P0 today -->
  <rect x="730" y="164" width="200" height="60" rx="10" fill="#f38ba8" fill-opacity="0.16" stroke="#f38ba8"/>
  <text x="830" y="188" fill="#f38ba8" font-size="16" font-weight="800" text-anchor="middle">P0 — act now</text>
  <text x="830" y="208" fill="#cdd6f4" font-size="11.5" text-anchor="middle">broken-today outranks everything</text>
  <line x1="630" y1="194" x2="726" y2="194" stroke="#f38ba8" stroke-width="2" marker-end="url(#arr)"/>
  <text x="670" y="184" fill="#f38ba8" font-size="11" font-weight="700">yes</text>

  <!-- Q2 Shor -->
  <rect x="330" y="252" width="300" height="52" rx="10" fill="#181825" stroke="#fab387"/>
  <text x="480" y="274" fill="#cdd6f4" font-size="13.5" font-weight="700" text-anchor="middle">Broken by Shor's algorithm?</text>
  <text x="480" y="292" fill="#7f849c" font-size="11.5" text-anchor="middle">RSA · Diffie-Hellman · ECDH · ECDSA · Ed25519</text>
  <line x1="480" y1="220" x2="480" y2="248" stroke="#cdd6f4" stroke-width="2" marker-end="url(#arr)"/>
  <text x="493" y="240" fill="#7f849c" font-size="11">no</text>

  <!-- Q3 HNDL -->
  <rect x="330" y="336" width="300" height="56" rx="10" fill="#181825" stroke="#fab387"/>
  <text x="480" y="357" fill="#cdd6f4" font-size="13.5" font-weight="700" text-anchor="middle">Does it protect recordable traffic?</text>
  <text x="480" y="376" fill="#7f849c" font-size="11.5" text-anchor="middle">key exchange / asymmetric encryption = capturable ciphertext</text>
  <line x1="480" y1="304" x2="480" y2="332" stroke="#fab387" stroke-width="2" marker-end="url(#arr)"/>
  <text x="493" y="324" fill="#fab387" font-size="11" font-weight="700">yes</text>

  <!-- P0 HNDL -->
  <rect x="730" y="318" width="200" height="72" rx="10" fill="#f38ba8" fill-opacity="0.16" stroke="#f38ba8"/>
  <text x="830" y="344" fill="#f38ba8" font-size="16" font-weight="800" text-anchor="middle">P0 — HNDL</text>
  <text x="830" y="362" fill="#cdd6f4" font-size="11.5" text-anchor="middle">harvest now, decrypt later:</text>
  <text x="830" y="378" fill="#cdd6f4" font-size="11.5" text-anchor="middle">recorded today, read post-quantum</text>
  <line x1="630" y1="364" x2="726" y2="356" stroke="#f38ba8" stroke-width="2" marker-end="url(#arr)"/>
  <text x="668" y="352" fill="#f38ba8" font-size="11" font-weight="700">yes</text>

  <!-- P1 signatures -->
  <rect x="730" y="414" width="200" height="66" rx="10" fill="#fab387" fill-opacity="0.16" stroke="#fab387"/>
  <text x="830" y="440" fill="#fab387" font-size="15" font-weight="800" text-anchor="middle">P1 — signatures</text>
  <text x="830" y="458" fill="#cdd6f4" font-size="11.5" text-anchor="middle">a recorded signature mostly</text>
  <text x="830" y="472" fill="#cdd6f4" font-size="11.5" text-anchor="middle">can't be retro-forged</text>
  <line x1="630" y1="376" x2="726" y2="440" stroke="#fab387" stroke-width="2" marker-end="url(#arr)"/>
  <text x="660" y="418" fill="#7f849c" font-size="11">no (signing)</text>

  <!-- Q4 weakened -->
  <rect x="330" y="424" width="300" height="56" rx="10" fill="#181825" stroke="#f9e2af"/>
  <text x="480" y="445" fill="#cdd6f4" font-size="13.5" font-weight="700" text-anchor="middle">Deprecated or Grover-weakened?</text>
  <text x="480" y="464" fill="#7f849c" font-size="11.5" text-anchor="middle">3DES · Blowfish · AES-128 · PBKDF2 · TLS 1.0/1.1 · SHA-256</text>
  <line x1="480" y1="392" x2="480" y2="420" stroke="#cdd6f4" stroke-width="2" marker-end="url(#arr)"/>
  <text x="493" y="412" fill="#7f849c" font-size="11">no</text>

  <!-- P2/P3 -->
  <rect x="330" y="512" width="140" height="62" rx="10" fill="#f9e2af" fill-opacity="0.14" stroke="#f9e2af"/>
  <text x="400" y="537" fill="#f9e2af" font-size="15" font-weight="800" text-anchor="middle">P2</text>
  <text x="400" y="556" fill="#cdd6f4" font-size="11" text-anchor="middle">plan migration</text>
  <rect x="490" y="512" width="140" height="62" rx="10" fill="#7d9fc9" fill-opacity="0.14" stroke="#7d9fc9"/>
  <text x="560" y="537" fill="#7d9fc9" font-size="15" font-weight="800" text-anchor="middle">P3</text>
  <text x="560" y="556" fill="#cdd6f4" font-size="11" text-anchor="middle">monitor (hashes)</text>
  <line x1="440" y1="480" x2="410" y2="508" stroke="#f9e2af" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="520" y1="480" x2="550" y2="508" stroke="#7d9fc9" stroke-width="2" marker-end="url(#arr)"/>
  <text x="415" y="500" fill="#f9e2af" font-size="11" font-weight="700">yes</text>

  <!-- Compliant -->
  <rect x="60" y="424" width="200" height="76" rx="10" fill="#a6e3a1" fill-opacity="0.14" stroke="#a6e3a1"/>
  <text x="160" y="450" fill="#a6e3a1" font-size="15" font-weight="800" text-anchor="middle">compliant</text>
  <text x="160" y="470" fill="#cdd6f4" font-size="11.5" text-anchor="middle">AES-256-GCM · ChaCha20</text>
  <text x="160" y="486" fill="#cdd6f4" font-size="11.5" text-anchor="middle">SHA-384 · ML-KEM · ML-DSA</text>
  <line x1="330" y1="452" x2="264" y2="452" stroke="#a6e3a1" stroke-width="2" marker-end="url(#arr)"/>
  <text x="296" y="442" fill="#a6e3a1" font-size="11" font-weight="700">no</text>

  <text x="480" y="606" fill="#7f849c" font-size="12" text-anchor="middle">precedence: broken-today &gt; harvest-now-decrypt-later &gt; quantum-broken signatures &gt; deprecated/weakened · every priority ships with its one-line justification</text>
</svg>
