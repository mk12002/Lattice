<svg xmlns="http://www.w3.org/2000/svg" width="980" height="440" viewBox="0 0 980 440" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="tarr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#cdd6f4"/>
    </marker>
  </defs>

  <rect width="980" height="440" fill="#1e1e2e"/>
  <text x="490" y="44" fill="#cdd6f4" font-size="24" font-weight="700" text-anchor="middle">Harvest now, decrypt later</text>
  <text x="490" y="68" fill="#7f849c" font-size="13" text-anchor="middle">why the breach window opens when recording starts — not when a quantum computer arrives</text>

  <!-- timeline axis -->
  <line x1="70" y1="250" x2="930" y2="250" stroke="#cdd6f4" stroke-width="2.5" marker-end="url(#tarr)"/>

  <!-- Migration band (E2 dot -> E3 dot); label sits inside, above the axis -->
  <rect x="380" y="214" width="240" height="58" rx="6" fill="#f9e2af" fill-opacity="0.13" stroke="#f9e2af" stroke-dasharray="5 4"/>
  <text x="500" y="234" fill="#f9e2af" font-size="11.5" font-weight="700" text-anchor="middle">the migration decade — 10–15 years</text>

  <!-- Event 1: today -->
  <line x1="150" y1="250" x2="150" y2="150" stroke="#45475a" stroke-width="1.5"/>
  <circle cx="150" cy="250" r="7" fill="#f38ba8"/>
  <rect x="50" y="94" width="200" height="56" rx="8" fill="#313244" stroke="#f38ba8"/>
  <text x="150" y="117" fill="#f38ba8" font-size="13.5" font-weight="700" text-anchor="middle">TODAY</text>
  <text x="150" y="136" fill="#cdd6f4" font-size="10.5" text-anchor="middle">adversary records ciphertext</text>
  <text x="150" y="280" fill="#a6adc8" font-size="11" text-anchor="middle">RSA / ECDH key exchange</text>
  <text x="150" y="296" fill="#a6adc8" font-size="11" text-anchor="middle">protects the traffic</text>

  <!-- Event 2: standards -->
  <line x1="380" y1="250" x2="380" y2="172" stroke="#45475a" stroke-width="1.5"/>
  <circle cx="380" cy="250" r="7" fill="#a6e3a1"/>
  <rect x="280" y="116" width="200" height="56" rx="8" fill="#313244" stroke="#a6e3a1"/>
  <text x="380" y="139" fill="#a6e3a1" font-size="13.5" font-weight="700" text-anchor="middle">2024 — done</text>
  <text x="380" y="158" fill="#cdd6f4" font-size="10.5" text-anchor="middle">NIST standardizes ML-KEM / ML-DSA</text>
  <text x="380" y="292" fill="#a6adc8" font-size="11" text-anchor="middle">the replacements exist;</text>
  <text x="380" y="308" fill="#a6adc8" font-size="11" text-anchor="middle">migration can start</text>

  <!-- Event 3: mandates -->
  <line x1="620" y1="250" x2="620" y2="150" stroke="#45475a" stroke-width="1.5"/>
  <circle cx="620" cy="250" r="7" fill="#f9e2af"/>
  <rect x="520" y="94" width="200" height="56" rx="8" fill="#313244" stroke="#f9e2af"/>
  <text x="620" y="117" fill="#f9e2af" font-size="13.5" font-weight="700" text-anchor="middle">~2030–2035</text>
  <text x="620" y="136" fill="#cdd6f4" font-size="10.5" text-anchor="middle">gov deadlines — CNSA 2.0 by 2033</text>

  <!-- Event 4: Q-day -->
  <line x1="850" y1="250" x2="850" y2="172" stroke="#45475a" stroke-width="1.5"/>
  <circle cx="850" cy="250" r="9" fill="#f38ba8"/>
  <rect x="750" y="116" width="200" height="56" rx="8" fill="#f38ba8" fill-opacity="0.16" stroke="#f38ba8"/>
  <text x="850" y="139" fill="#f38ba8" font-size="13.5" font-weight="700" text-anchor="middle">Q-DAY (year unknown)</text>
  <text x="850" y="158" fill="#cdd6f4" font-size="10.5" text-anchor="middle">recorded ciphertext opens</text>
  <text x="850" y="280" fill="#a6adc8" font-size="11" text-anchor="middle">Shor's algorithm breaks the</text>
  <text x="850" y="296" fill="#a6adc8" font-size="11" text-anchor="middle">recorded key exchange</text>

  <!-- shelf-life band -->
  <rect x="150" y="342" width="700" height="40" rx="6" fill="#f38ba8" fill-opacity="0.12" stroke="#f38ba8"/>
  <text x="500" y="367" fill="#f38ba8" font-size="12.5" font-weight="700" text-anchor="middle">shelf life of long-lived data — health records, legal files, source code, state secrets (25+ years)</text>
  <text x="500" y="404" fill="#cdd6f4" font-size="13" text-anchor="middle">if the data still matters at Q-day, the breach effectively happened at recording time</text>
  <text x="500" y="428" fill="#7f849c" font-size="12" text-anchor="middle">→ urgency is set by your data's shelf life, not by quantum hardware headlines</text>
</svg>
